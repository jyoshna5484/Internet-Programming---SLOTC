<!DOCTYPE html>
<html>
<head>
    <title>Electricity Bill Payment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Electricity Bill Payment</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#register">Register</a>
        <a href="#login">Login</a>
        <a href="#admin">Admin</a>
        <a href="#bill">Bill</a>
        <a href="#payment">Payment</a>
    </nav>
</header>

<section id="home">
    <h2>Online Electricity Bill Payment</h2>
    <p>Pay your electricity bills quickly and conveniently.</p>
</section>

<!-- Customer Registration -->
<section id="register">
    <h2>Customer Registration</h2>

    <form id="registerForm">
        <input type="text" id="regName" placeholder="Customer Name" required>
        <input type="text" id="regId" placeholder="Customer ID" required>
        <input type="email" id="regEmail" placeholder="Email Address" required>
        <input type="password" id="regPassword" placeholder="Password" required>

        <select id="connectionType" required>
            <option value="">Select Connection Type</option>
            <option value="domestic">Domestic</option>
            <option value="commercial">Commercial</option>
        </select>

        <button type="submit">Register</button>
    </form>
</section>

<!-- Customer Login -->
<section id="login">
    <h2>Customer Login</h2>

    <form id="loginForm">
        <input type="text" id="loginId" placeholder="Customer ID" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p id="loginMessage"></p>
</section>

<!-- Admin Login -->
<section id="admin">
    <h2>Admin Login</h2>

    <form id="adminForm">
        <input type="text" id="adminName" placeholder="Admin Username" required>
        <input type="password" id="adminPassword" placeholder="Admin Password" required>
        <button type="submit">Login as Admin</button>
    </form>

    <div id="adminPanel" style="display:none;">
        <h3>Update Billing Details</h3>

        <form id="billingForm">
            <label>Domestic Rate - First 100 Units</label>
            <input type="number" id="domestic1" value="1">

            <label>Domestic Rate - 101 to 200 Units</label>
            <input type="number" id="domestic2" value="2.5" step="0.1">

            <label>Domestic Rate - 201 to 500 Units</label>
            <input type="number" id="domestic3" value="4">

            <label>Domestic Rate - Above 500 Units</label>
            <input type="number" id="domestic4" value="6">

            <label>Commercial Rate - First 100 Units</label>
            <input type="number" id="commercial1" value="2">

            <label>Commercial Rate - 101 to 200 Units</label>
            <input type="number" id="commercial2" value="4.5" step="0.1">

            <label>Commercial Rate - 201 to 500 Units</label>
            <input type="number" id="commercial3" value="6">

            <label>Commercial Rate - Above 500 Units</label>
            <input type="number" id="commercial4" value="7">

            <label>Bill Start Date</label>
            <input type="date" id="startDate" required>

            <label>Bill End Date</label>
            <input type="date" id="endDate" required>

            <label>Last Payment Date</label>
            <input type="date" id="dueDate" required>

            <button type="submit">Update Billing Details</button>
        </form>
    </div>
</section>

<!-- Electricity Bill -->
<section id="bill">
    <h2>Electricity Bill</h2>

    <form id="billForm">
        <input type="text" id="billCustomer" placeholder="Customer ID" required>
        <input type="number" id="units" placeholder="Units Consumed" min="0" required>

        <select id="billType" required>
            <option value="">Connection Type</option>
            <option value="domestic">Domestic</option>
            <option value="commercial">Commercial</option>
        </select>

        <button type="submit">Calculate Bill</button>
    </form>

    <div id="billResult"></div>
</section>

<!-- Payment -->
<section id="payment">
    <h2>Bill Payment</h2>

    <form id="paymentForm">
        <input type="text" id="payCustomer" placeholder="Customer ID" required>
        <input type="number" id="payAmount" placeholder="Amount to Pay" required>

        <select id="paymentMethod" required>
            <option value="">Select Payment Method</option>
            <option>Credit Card</option>
            <option>Debit Card</option>
            <option>Net Banking</option>
            <option>Digital Wallet</option>
        </select>

        <button type="submit">Pay Now</button>
    </form>

    <div id="receipt"></div>
</section>

<footer>
    <p>&copy; 2026 Electricity Bill Payment System</p>
</footer>

<script src="script.js"></script>
</body>
</html>
