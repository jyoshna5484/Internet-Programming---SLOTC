<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Hearthside Library</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body data-page="login">
  <header id="site-header"></header>
  <main class="shell page-main narrow-page">
    <p class="eyebrow">Welcome back</p><h1>Sign in to your library</h1>
    <p class="page-lead">Your loans, due dates, and course materials are waiting.</p>
    <form id="login-form" class="form-panel">
      <label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="email" required>
      <label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required>
      <button class="button button-dark button-wide" type="submit">Sign in</button>
      <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
    </form>
    <div class="demo-note"><strong>Demo accounts</strong><span>Student: student@library.local / student123</span><span>Librarian: admin@library.local / admin123</span></div>
    <p class="form-footnote">New to the library? <a href="register.html">Create an account</a></p>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
