<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study materials | Hearthside Library</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body data-page="materials">
  <header id="site-header"></header>
  <main class="shell page-main">
    <p class="eyebrow">Course companion</p><h1>Study materials</h1><p class="page-lead">Find notes and revision guides for your year and semester.</p>
    <form id="material-filter" class="filter-bar">
      <label for="material-year">Year</label><select id="material-year"><option value="">All years</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select>
      <label for="material-semester">Semester</label><select id="material-semester"><option value="">All semesters</option><option>Semester 1</option><option>Semester 2</option><option>Semester 3</option><option>Semester 4</option><option>Semester 5</option><option>Semester 6</option><option>Semester 7</option><option>Semester 8</option></select>
      <button class="button button-dark" type="submit">Find materials</button>
    </form>
    <p id="material-count" class="result-count"></p><p id="material-empty" class="empty-state" hidden>No materials found for this year and semester.</p>
    <div id="material-list" class="material-list"></div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
