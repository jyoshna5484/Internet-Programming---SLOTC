<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Hearthside Library</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body data-page="register">
  <header id="site-header"></header>
  <main class="shell page-main narrow-page">
    <p class="eyebrow">Join the library</p><h1>Make yourself at home.</h1>
    <p class="page-lead">Create a student account to borrow books and keep your study materials together.</p>
    <form id="register-form" class="form-panel form-grid">
      <label for="register-name">Full name</label><input id="register-name" name="name" autocomplete="name" required>
      <label for="register-email">Email address</label><input id="register-email" name="email" type="email" autocomplete="email" required>
      <label for="register-department">Department</label><input id="register-department" name="department" required>
      <label for="register-year">Year of study</label>
      <select id="register-year" name="year" required><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select>
      <label for="register-password">Password</label><input id="register-password" name="password" type="password" minlength="6" autocomplete="new-password" required>
      <label for="register-confirm">Confirm password</label><input id="register-confirm" name="confirm" type="password" minlength="6" autocomplete="new-password" required>
      <button class="button button-dark button-wide" type="submit">Create account</button>
      <p id="register-message" class="form-message" role="status" aria-live="polite"></p>
    </form>
    <p class="form-footnote">Already registered? <a href="login.html">Sign in</a></p>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
